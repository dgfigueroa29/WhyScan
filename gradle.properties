# --- Gradle ---
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# --- Kotlin ---
kotlin.code.style=official
# 6 GB y no 1: con 1024m el backend de Wasm se quedaba sin memoria y el job `Web (Wasm)` llevaba en
# rojo desde el 28-08-2026, en `main` incluida. `compileProductionExecutableKotlinWasmJs` compila el
# programa **entero** de una vez —`compileWholeProgramModeToWasmIr`— y mantiene en memoria los
# metadatos de todas las clases a la vez, así que el pico crece con el tamaño de la app y no con el
# del módulo. El propio compilador lo dice al morir: "Not enough memory to run compilation. Try to
# increase it via kotlin.daemon.jvmargs".
#
# `-Xmx` es un techo, no una reserva: subirlo no le cuesta nada a quien compile solo Android, y el
# runner de CI tiene 16 GB. Bajarlo otra vez sin comprobar Wasm es volver a romperlo.
kotlin.daemon.jvmargs=-Xmx6g
# Silencia el aviso de targets Kotlin/Native no compilables en el host actual:
# iOS solo se compila en macOS, y eso es esperado en CI de Linux.
kotlin.native.ignoreDisabledTargets=true
# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
# --- Compose ---
org.jetbrains.compose.experimental.wasm.enabled=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
