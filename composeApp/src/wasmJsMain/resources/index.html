<!DOCTYPE html>
<!--
    `lang` en inglés y no en español: es el respaldo, igual que el catálogo `values/`. El idioma real
    de la interfaz lo decide `navigator.language` en el navegador, no este atributo.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
    <title>WhyScan</title>
    <meta content="Scan barcodes and QR codes. Nothing leaves your device." name="description">
    <!--
        Color de la barra del navegador en móvil, con las dos variantes para que no se quede en
        blanco sobre una app en modo oscuro. Los valores son `ScannerPalette.*.BACKGROUND`.
    -->
    <meta content="#F8FAFC" media="(prefers-color-scheme: light)" name="theme-color">
    <meta content="#0B1020" media="(prefers-color-scheme: dark)" name="theme-color">
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }

        /*
            El canvas de Compose tarda en aparecer. Sin esto, ese hueco es blanco también en modo
            oscuro, que es el mismo destello de arranque que se corrige en Android con
            `windowBackground`.
        */
        body { background-color: #F8FAFC; }

        @media (prefers-color-scheme: dark) {
            body { background-color: #0B1020; }
        }
    </style>
</head>
<body>
<script src="composeApp.js"></script>
</body>
</html>
