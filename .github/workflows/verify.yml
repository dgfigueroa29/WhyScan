name: Verify

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  # Un push nuevo sobre la misma rama cancela el build anterior: no tiene sentido gastar runners
  # verificando un commit que ya quedó obsoleto.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.welcome=never

jobs:
  # Lo primero que corre y lo más barato: si el análisis estático o los tests del núcleo fallan, no
  # tiene sentido pagar los builds de plataforma.
  checks:
    name: Detekt y tests del núcleo
    runs-on: ubuntu-latest
    # Los cuatro jobs llevan tope. El margen por defecto es de **seis horas**, y lo que se cuelga en
    # una build no suele fallar: se queda esperando. Desde que hay un test que compone la app de
    # verdad (`AppCompositionTest`), un flujo que no se calla dejaría el runner ahí toda la tarde.
    # Los números son holgados respecto a lo que tarda cada job hoy, no ajustados.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Antes que nada y antes que Java: tarda segundos, no necesita Gradle y comprueba cosas que no
      # comprueba nadie más —la paridad de los catálogos de recursos entre idiomas, las claves
      # huérfanas y que el `package` siga a su carpeta—. Que corra aquí no es solo por rapidez: es
      # lo que impide que estas comprobaciones se desincronicen de lo que detekt exige de verdad
      # sin que nadie se entere (deuda D23).
      - name: Comprobaciones sin compilador
        run: python3 tools/checks.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Detekt
        run: ./gradlew detekt

      # D24: declarar una versión no la impone. Si otro punto del grafo pide una superior, Gradle
      # resuelve la mayor para todo el classpath y lo escrito en el catálogo pasa a ser una
      # sugerencia. Costó una tanda entera: `kotlinx-datetime` fijado en 0.6.2 y resuelto en 0.7+,
      # donde el tipo que se usaba sobrevive solo como typealias — compilaba y reventaba al
      # ejecutar. Esto lo dice antes, y falla solo cuando lo sustituido es **nuestra** declaración.
      - name: Versiones declaradas contra versiones resueltas
        run: |
          # Sin `--quiet`: el informe se imprime a nivel `lifecycle` y `--quiet` lo silenciaría,
          # dejando un archivo vacío. Sin caché de configuración porque `dependencies` no es
          # compatible con ella, y aquí es mejor decirlo que descubrirlo.
          ./gradlew --no-configuration-cache :composeApp:dependencies > dependencias.txt
          ./gradlew --no-configuration-cache :androidApp:dependencies >> dependencias.txt
          python3 tools/check_resolved_versions.py dependencias.txt

      # Sin rutas de proyecto a propósito: Gradle ejecuta la tarea en **todos** los módulos que la
      # tengan. La lista escrita a mano que había aquí antes ya se había quedado corta —los tests de
      # `:core:designsystem` y `:engines:zxing-java` existían y no los corría nadie—, y un test que
      # no se ejecuta es peor que no tenerlo. `desktopTest` va aparte porque el target JVM de
      # `:composeApp` se llama `desktop`.
      - name: Tests multiplataforma del núcleo y las features
        run: ./gradlew jvmTest desktopTest

      # Aparte de la línea de arriba porque la tarea se llama distinto, no porque sea otra clase de
      # test: es JVM y sin emulador, como todo lo demás. Monta el `platformModule` de Android con
      # Robolectric y comprueba que resuelve — la mitad de D18 que `desktopTest` no puede cubrir.
      - name: Tests de JVM del grafo de Android
        run: ./gradlew :composeApp:testDebugUnitTest

      # El SDD §13.1 promete "≥ 80 % en `:core:domain` y `:core:data`" desde hace tiempo y hasta
      # ahora **no había nada que lo midiera**: cincuenta y un ficheros de test y nadie sabía el
      # número. Un objetivo que no se mide no dice cuándo se incumple, así que se incumple sin que
      # nadie se entere.
      #
      # La primera medición dio 89,0 % en `:core:domain` y 60,8 % en `:core:data`, y lo que encontró
      # en el segundo no fue falta de tests sino **código muerto**: `InMemoryRepositories.kt`, dos
      # clases que ningún módulo de Koin declaraba desde que Room y `Settings` las sustituyeron. La
      # respuesta correcta ahí era borrarlas, no escribirles tests: un test sobre código que nadie
      # usa sube el número y no protege nada.
      #
      # Ya con el dato delante, el umbral del SDD §13.1 se exige de verdad.
      #
      # **Y desde la Ronda 13 se miden también las tres features**, que es donde viven los cuatro
      # ViewModels con la máquina de estados. Entran **sin suelo a propósito**: tienen tests, así
      # que el problema nunca fue la falta de red — era que nadie sabía el número, el mismo reproche
      # de la Ronda 5 un módulo más allá. Inventar un umbral antes de la primera medición solo tiene
      # dos finales y los dos son malos: o rompe CI el primer día, o se elige tan bajo que no exige
      # nada. Se mide, se mira, y el suelo se fija después con el dato delante — igual que se hizo
      # con dominio y datos.
      #
      # La tabla se publica además en el **resumen del run**, y no es cosmético: el log de este job
      # pasa de las dos mil líneas y el número quedaba enterrado ahí dentro. Un dato que hay que
      # excavar es un dato que nadie mira, y todo el sentido de medir cobertura es mirarla.
      - name: Cobertura del núcleo y de las features
        run: |
          ./gradlew \
            :core:domain:koverXmlReport :core:data:koverXmlReport \
            :feature:scanner:koverXmlReport :feature:history:koverXmlReport \
            :feature:settings:koverXmlReport

          python3 tools/coverage.py \
            core/domain=80 core/data=80 \
            feature/scanner feature/history feature/settings | tee cobertura.txt
          # El estado de `python3`, no el de `tee`, que siempre sale con cero.
          status=${PIPESTATUS[0]}

          {
            echo '### Cobertura de líneas'
            echo
            echo '```text'
            cat cobertura.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      - name: Publicar informes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informes-checks
          path: |
            **/build/reports/detekt/**
            **/build/reports/tests/**
            **/build/reports/kover/**
          if-no-files-found: ignore

  # Nota sobre el baseline profile: **no se genera aquí**. Generarlo exige arrancar un emulador y
  # recorrer la app, unos quince minutos que no deciden si un cambio entra o no. Vive en
  # `baseline-profile.yml` y se lanza a mano, igual que iOS. Lo que sí comprueba este workflow es
  # que el cableado del plugin no rompe la build: `assembleRelease` consume el perfil versionado.

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Ensamblar debug
        run: ./gradlew :androidApp:assembleDebug

      - name: Lint
        run: ./gradlew :androidApp:lintDebug

      # Es lo único que ejecuta R8 de verdad. Sin este paso, activar `minify` sería configuración
      # que nadie comprueba: los fallos de ofuscación no aparecen en la build de debug.
      - name: Ensamblar release (R8)
        run: ./gradlew :androidApp:assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: apk-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # El mapping es lo que hace legible una traza de release. Sin él, un fallo en producción es
      # una pila de nombres de una letra.
      - uses: actions/upload-artifact@v7
        with:
          name: r8-mapping
          path: androidApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew :composeApp:desktopJar

  web:
    name: Web (Wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew :composeApp:wasmJsBrowserDistribution

# iOS no está aquí a propósito: vive en `ios.yml` y solo se lanza a mano. Ver la cabecera de ese
# archivo para el motivo. `Verify` cubre las tres plataformas que este proyecto puede *probar*, y
# por eso es el workflow que decide si un cambio entra o no.
