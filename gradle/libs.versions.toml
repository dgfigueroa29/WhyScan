[versions]
# Toolchain
#
# Kotlin 2.3.20 no es un capricho: es el suelo que impone consumir zxing-cpp (ADR-0008). Sus klibs
# publicados están compilados con 2.2.0 y un compilador no lee klibs de uno más nuevo. Se eligió
# exactamente 2.3.20 —y no la 2.3.21— porque es la versión con la que están compilados Compose
# Multiplatform 1.11.1, Koin 4.2.2 y KSP 2.3.10: emparejar exacto reduce la
# superficie de fallo en un build que todavía no se ha podido ejecutar.
#
# AGP estuvo en 8.9.2 mientras no hubo forma de contrastarlo: vive en el maven de Google,
# inalcanzable desde el entorno de desarrollo, así que subirlo habría sido adivinar un número. Ese
# era el riesgo R11 del SDD, y el primer CI lo confirmó con el número exacto:
#
#     Failed to apply plugin 'com.google.devtools.ksp'.
#     > The minimum supported AGP version is 8.10.0.
#
# El salto fue a 8.10.0 —el mínimo que KSP 2.3.10 exige, lo dice su propio mensaje— y de ahí a
# 8.13.2 al abrir el proyecto en Android Studio por primera vez. Gradle 8.14.5 cumple de sobra el
# mínimo que AGP 8.13 pide, y el CI ensambla debug, pasa lint y ensambla release con R8 sobre esta
# versión, así que se queda.
kotlin = "2.4.10"
#noinspection AndroidGradlePluginVersion
agp = "8.13.2"
#noinspection NewerVersionAvailable,GradleDependency
composeMultiplatform = "1.12.0"
# Las dos piezas de Compose que NO van a la versión del plugin. No es un descuido: es lo que
# declara `ComposePlugin$Dependencies` dentro del propio plugin 1.11.1, y el motivo de cada una
# está junto a su coordenada en `[libraries]`. Al subir `composeMultiplatform` hay que releerlo.
composeMaterial3 = "1.9.0"
composeMaterialIcons = "1.7.3"
jvmTarget = "17"

# Android SDK
#
# `compileSdk` a 36 porque lo exigen las dependencias que arrastra Compose Multiplatform 1.11.1
# —`androidx.lifecycle` y `androidx.navigationevent`, entre otras—: el lint de release fallaba con
# "requires libraries and applications that depend on it to compile against version 36 or later".
#
# `targetSdk` en 36 porque **Play lo exige para publicar**, no porque se haya podido probar. Son
# cosas distintas de `compileSdk`: este dice contra qué APIs se compila, `targetSdk` a qué
# comportamientos de runtime se acoge la app.
#
# Estuvo en 36 sin querer —lo subió `fix: first open in android studio`, contradiciendo al
# comentario que había aquí—, se bajó a 35 mientras se buscaba un fallo de arranque, y vuelve a 36
# ya con el trabajo hecho en vez de como efecto colateral. Lo que 36 activa, y qué se hizo con cada
# cosa:
#
#   - **Predictive back por defecto.** Era el único de los tres que podía romper algo de verdad, y
#     rompía: `MainActivity` interceptaba el atrás con un callback siempre habilitado que se
#     autodesactivaba para volver a lanzar `onBackPressed()`. Con predictive back el sistema elige
#     la animación al **empezar** el gesto, así que siempre pintaba la de "vuelvo dentro de la app"
#     aunque tocara cerrar. Sustituido por `BackHandler(enabled = backstack.size > 1)`.
#   - **Edge-to-edge obligatorio.** `enableEdgeToEdge()` ya estaba, y los insets los aplica el
#     `Scaffold` de Material 3 con sus valores por defecto. No hay ni un `WindowInsets` a mano en
#     todo el proyecto, así que no hay nada que se contradiga con lo que hace el sistema. **Queda
#     por mirar con los ojos** en un dispositivo: es la clase de cosa que no rompe, se ve mal.
#   - **`setStatusBarColor` / `setNavigationBarColor` convertidos en no-op.** No se llaman en
#     ninguna parte, ni desde el tema. Sin efecto aquí.
#
# Conviene dejar dicho, porque costó una vuelta entera: **el fallo de arranque que se estaba
# buscando cuando esto bajó a 35 no era de `targetSdk`.** Era un `Executor` mal declarado en el
# grafo de Koin (ver `AppModule.android.kt`). Bajar el número no arreglaba nada y subirlo no rompía
# nada; lo que sí había era el defecto de predictive back de arriba, real pero de animación. La
# lección es la de siempre: sin un logcat, un cambio de configuración es un sospechoso cómodo y
# nada más.
compileSdk = "36"
minSdk = "24"
targetSdk = "36"

# Kotlin ecosystem
coroutines = "1.11.0"
# La dependencia que §9.7 evitó a conciencia para no formatear una columna de un CSV. Con cabeceras
# de fecha en el historial el cálculo cambia: agrupar por día exige saber en qué día cayó un instante,
# y eso es una zona horaria y un calendario — no aritmética sobre milisegundos.
# Se intentó fijar la 0.6.2 —donde `kotlinx.datetime.Instant` es una clase de verdad— y **no sirvió
# de nada**: algo más del grafo pide una versión superior, Gradle resuelve la mayor para todo el
# classpath, y el resultado fue lo peor de los dos mundos. Compilaba (en 0.7+ ese nombre sobrevive
# como typealias, que el compilador acepta) y reventaba al ejecutar con
# `ClassNotFoundException: kotlinx.datetime.Instant`, porque un typealias no es una clase.
#
# La lección: declarar una versión no la impone. Se declara la que de verdad se resuelve y se usa
# `kotlin.time.Instant` de la stdlib, que es a donde se mudaron esos tipos.
kotlinxDatetime = "0.8.0"
serialization = "1.11.0"

# AndroidX / Jetbrains multiplatform
androidxActivityCompose = "1.13.0"
# 1.18.0 y no 1.15.0, que es lo que decía antes: el grafo ya resolvía 1.18.0 por otra vía, así
# que lo declarado era una versión que no usaba nadie. Lo destapó `tools/check_resolved_versions.py`
# en su primera ejecución, que es exactamente para lo que existe (deuda D24).
#noinspection GradleDependency
androidxCoreKtx = "1.18.0"
# La pantalla de arranque del sistema (API 31+) con su compatibilidad hacia atrás hasta la 24, que
# es el mínimo de esta app. Lleva en 1.0.1 desde 2022 y no es abandono: la biblioteca es un puente
# hacia una API de plataforma que ya no cambia.
#noinspection GradleDependency
androidxCoreSplashscreen = "1.0.1"
# La que pide Koin 4.2.2; subirla más alto haría que Gradle resolviera por encima de lo que espera.
#noinspection NewerVersionAvailable
lifecycle = "2.9.6"

# DI
koin = "4.2.2"

# Persistencia
multiplatformSettings = "1.3.0"
# Sin verificar contra KSP 2.3.10: androidx.room solo se publica en el maven de Google.
room = "2.8.4"
sqlite = "2.7.0"
# KSP cambió de esquema de versiones: 2.3.10 es la compilada contra Kotlin 2.3.20.
ksp = "2.3.11"

# Test
turbine = "1.2.1"
# Robolectric: un `Context` de Android de verdad **en la JVM**, sin emulador. Es lo que permite que
# `androidUnitTest` monte el grafo de Koin de Android, que es donde estaba el defecto D18. No
# contradice la decisión D6 de no tener tests instrumentados: eso descarta lo que exige dispositivo,
# y esto corre en el mismo job que el resto de tests.
robolectric = "4.16.1"

# Rendimiento
#
# `benchmark` da a la vez la librería de macrobenchmark y el plugin `androidx.baselineprofile`: son
# el mismo tren de versiones y desemparejarlos no tiene sentido.
#
# `profileinstaller` va en la app y no en el módulo generador: es lo que instala el perfil en
# Android 7-11, donde el sistema no lo hace solo. Con `minSdk` 24, eso es la mitad del rango que
# esta app soporta.
benchmark = "1.4.1"
profileinstaller = "1.4.1"
androidxTestJunit = "1.3.0"
uiautomator = "2.4.0"
junit = "4.13.2"

# Quality
detekt = "1.23.8"
# Mide la cobertura de `:core:domain` y `:core:data`, que es donde el SDD §13.1 pone un objetivo.
# Solo esos dos: la cobertura de la UI no dice nada útil y perseguirla empuja a escribir tests que
# recorren líneas sin comprobar nada.
kover = "0.9.9"

# Fase 2+ — declarados aquí para que el catálogo sea la única fuente de versiones
playServicesCodeScanner = "16.1.0"
mlkitBarcode = "17.3.0"
mlkitTextRecognition = "16.0.1"
camerax = "1.6.2"
# Baseline de comparación: dos artefactos distintos del mismo proyecto (ADR-0008).
zxingcpp = "3.1.1"
# ZXing en Java puro, para escritorio. Otro proyecto que el anterior pese al nombre: este es el
# original en Java, no el port a C++ (deuda D13).
zxingJava = "3.5.4"

[libraries]
# Compose Multiplatform, con coordenadas explícitas.
#
# Antes esto se escribía `implementation(compose.material3)`, con los accesores que instala el
# plugin. El propio compilador pedía dejar de hacerlo —"'material3: String' is deprecated. Specify
# dependency directly"— en 27 de los 44 avisos que D19 inventarió.
#
# **Los números no se dedujeron: se leyeron del plugin.** Las coordenadas están dentro de
# `org.jetbrains.compose:compose-gradle-plugin:1.11.1`, en `ComposePlugin$Dependencies`, que es lo
# que los accesores devolvían. Importaba mirarlo porque **dos no siguen la versión del plugin**, y
# ninguna de las dos se habría acertado a ojo:
#
#   - `material3` va en **1.9.0**. No existe un `org.jetbrains.compose.material3:material3:1.11.1`
#     publicado: el artefacto salta de `1.11.0-alpha07` a `1.12.0-alpha01`. Escribir 1.11.1 aquí
#     habría roto la resolución entera.
#   - `material-icons-extended` está **clavado en 1.7.3** y no recibe más actualizaciones. Lo dice
#     el propio plugin en el mensaje de deprecación del accesor, que además propone la salida:
#     migrar a Material Symbols como recursos vectoriales. Ese aviso es uno de los dos que D19 dejó
#     vivos a propósito, y ahora está aquí en vez de en un log que nadie lee.
#
# **El coste de esto, dicho:** hasta ahora el plugin era quien sabía qué versión de cada pieza va
# con cada versión de Compose, y ese conocimiento pasa a estar aquí. Al subir `composeMultiplatform`
# hay que volver a leer `ComposePlugin$Dependencies` de la versión nueva en lugar de suponer que
# todo sube junto — porque, como se ve arriba, no sube junto. A cambio, Dependabot ve estas
# dependencias, que antes le eran invisibles.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "composeMaterialIcons" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidxCoreSplashscreen" }

lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-test = { module = "io.insert-koin:koin-test" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }

multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatformSettings" }
multiplatform-settings-test = { module = "com.russhwolf:multiplatform-settings-test", version.ref = "multiplatformSettings" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# Baseline profile: la librería y el runner viven en el módulo generador, `profileinstaller` en la app.
benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
junit = { module = "junit:junit", version.ref = "junit" }

detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

# Artefactos de los plugins, para que build-logic pueda compilar los convention plugins
gradlePlugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
gradlePlugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
